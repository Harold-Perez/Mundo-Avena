<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario — Mundo Avena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f0e8; font-family: 'Segoe UI', sans-serif; }

        .navbar { background: #1a2e1a; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(178,140,101,0.3); }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .nav-logo { background: white; border-radius: 6px; padding: 5px 10px; }
        .nav-logo img { height: 26px; object-fit: contain; }
        .nav-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.15); }
        .nav-role { color: #b28c65; font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        .nav-right { display: flex; gap: 8px; align-items: center; }
        .nav-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.75); border-radius: 6px; padding: 5px 14px; font-size: 11px; text-decoration: none; }
        .nav-btn:hover { background: rgba(255,255,255,0.15); color: white; text-decoration: none; }

        .content { padding: 28px; max-width: 700px; margin: 0 auto; }
        .page-badge { display: inline-block; background: #b28c65; color: white; font-size: 9px; font-weight: 700; padding: 3px 12px; border-radius: 20px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
        .page-title { font-size: 22px; font-weight: 700; color: #1a2e1a; margin: 0 0 2px; }
        .page-sub { font-size: 13px; color: #aaa; margin-bottom: 24px; }

        .alerta-error { background: #fef2f2; border-left: 4px solid #A32D2D; border-radius: 8px; padding: 12px 16px; color: #A32D2D; font-size: 13px; margin-bottom: 20px; }

        .form-card { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #b28c65; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #f0ebe3; }

        .form-label { font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; display: block; }
        .form-control { width: 100%; border: 1.5px solid #e0d8ce; border-radius: 10px; padding: 10px 14px; font-size: 13px; background: #faf9f7; color: #333; transition: all 0.2s; }
        .form-control:focus { border-color: #2d5a27; background: white; box-shadow: 0 0 0 3px rgba(45,90,39,0.1); outline: none; }
        .form-control[readonly] { background: #f0ebe3; color: #888; cursor: not-allowed; }
        select.form-control { appearance: none; cursor: pointer; }

        .form-check { display: flex; align-items: center; gap: 10px; }
        .form-check-input { width: 18px; height: 18px; border: 1.5px solid #e0d8ce; border-radius: 4px; cursor: pointer; accent-color: #2d5a27; }
        .form-check-label { font-size: 13px; color: #444; cursor: pointer; }

        .nota { background: #fff8e1; border-left: 3px solid #b28c65; border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 12px; color: #7a6030; margin-top: 8px; }

        .btn-guardar { background: #2d5a27; color: white; border: none; border-radius: 10px; padding: 12px 32px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-guardar:hover { background: #1e3d1a; transform: translateY(-1px); }
        .btn-cancelar { background: white; color: #666; border: 1.5px solid #e0d8ce; border-radius: 10px; padding: 12px 24px; font-size: 14px; text-decoration: none; transition: all 0.2s; display: inline-block; }
        .btn-cancelar:hover { background: #f5f0e8; color: #444; text-decoration: none; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <div class="nav-logo">
            <img src="/img/logo-mundoavena.png" alt="Mundo Avena">
        </div>
        <div class="nav-sep"></div>
        <div class="nav-role">Administrador</div>
    </div>
    <div class="nav-right">
        <a href="/admin/usuarios" class="nav-btn">← Volver a Usuarios</a>
    </div>
</nav>

<div class="content">
    <div class="page-badge">Administrador</div>
    <div class="page-title" th:text="${usuario.id == null ? '➕ Nuevo Usuario' : '✏️ Editar Usuario'}">Usuario</div>
    <div class="page-sub" th:text="${usuario.id == null ? 'Crear un nuevo usuario en el sistema' : 'Modificar datos del usuario'}"></div>

    <div th:if="${error}" class="alerta-error">
        ⚠️ <span th:text="${error}"></span>
    </div>

    <div class="form-card">
        <form th:object="${usuario}"
              th:action="${usuario.id == null ? '/admin/usuarios/nuevo' : '/admin/usuarios/editar/' + usuario.id}"
              method="post">

            <div class="section-title">Información Personal</div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" name="nombreCompleto"
                           th:value="${usuario.nombreCompleto}"
                           placeholder="Ej: Juan Carlos Pérez" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Usuario (login)</label>
                    <input type="text" class="form-control" name="username"
                           th:value="${usuario.username}"
                           placeholder="Ej: jperez"
                           th:readonly="${usuario.id != null}" required>
                </div>
            </div>

            <div class="section-title">Acceso y Permisos</div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">
                        <span th:if="${usuario.id == null}">Contraseña</span>
                        <span th:unless="${usuario.id == null}">Nueva Contraseña</span>
                    </label>
                    <input type="password" class="form-control" name="password"
                           placeholder="Mínimo 6 caracteres"
                           th:required="${usuario.id == null}">
                    <div class="nota" th:if="${usuario.id != null}">
                        ⚠️ Dejar en blanco para mantener la contraseña actual
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Rol</label>
                    <select class="form-control" name="rol" required>
                        <option value="">Seleccionar rol...</option>
                        <option value="ADMINISTRADOR"
                                th:selected="${usuario.rol != null && usuario.rol.name() == 'ADMINISTRADOR'}">
                            Administrador
                        </option>
                        <option value="GERENCIA"
                                th:selected="${usuario.rol != null && usuario.rol.name() == 'GERENCIA'}">
                            Gerencia
                        </option>
                        <option value="EMPLEADO"
                                th:selected="${usuario.rol != null && usuario.rol.name() == 'EMPLEADO'}">
                            Empleado
                        </option>
                        <option value="INVENTARIO"
                                th:selected="${usuario.rol != null && usuario.rol.name() == 'INVENTARIO'}">
                            Inventario
                        </option>
                    </select>
                </div>
            </div>

            <div class="section-title">Estado</div>
            <div class="mb-4">
                <div class="form-check">

                    <input class="form-check-input"
                           type="checkbox"
                           th:field="*{activo}"
                           id="activo">

                    <label class="form-check-label" for="activo">
                        Usuario activo — puede iniciar sesión en el sistema
                    </label>

                </div>
            </div>

            <div class="d-flex gap-3 mt-2">
                <button type="submit" class="btn-guardar">
                    💾
                    <span th:if="${usuario.id == null}">Crear Usuario</span>
                    <span th:unless="${usuario.id == null}">Guardar Cambios</span>
                </button>
                <a href="/admin/usuarios" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
