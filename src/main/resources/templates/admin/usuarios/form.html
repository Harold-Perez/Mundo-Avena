<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f0e8; }
        .navbar { background-color: #2d5a27; }
        .btn-primary { background-color: #2d5a27; border-color: #2d5a27; }
        .btn-primary:hover { background-color: #1e3d1a; }
        .card { border-radius: 16px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">🌾 Mundo Avena - Admin</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h4 class="fw-bold mb-4" th:text="${titulo}"></h4>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:if="${usuario.id == null}"
                      th:action="@{/admin/usuarios/nuevo}" method="post">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuario</label>
                        <input type="text" class="form-control" name="username"
                               th:value="${usuario.username}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre Completo</label>
                        <input type="text" class="form-control" name="nombreCompleto"
                               th:value="${usuario.nombreCompleto}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Rol</label>
                        <select class="form-select" name="rol" required>
                            <option th:each="r : ${roles}"
                                    th:value="${r}"
                                    th:text="${r}"></option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a href="/admin/usuarios" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>

                <form th:if="${usuario.id != null}"
                      th:action="@{/admin/usuarios/editar/{id}(id=${usuario.id})}" method="post">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuario</label>
                        <input type="text" class="form-control"
                               th:value="${usuario.username}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre Completo</label>
                        <input type="text" class="form-control" name="nombreCompleto"
                               th:value="${usuario.nombreCompleto}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Rol</label>
                        <select class="form-select" name="rol">
                            <option th:each="r : ${roles}"
                                    th:value="${r}"
                                    th:text="${r}"
                                    th:selected="${r == usuario.rol}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Estado</label>
                        <select class="form-select" name="activo">
                            <option value="true" th:selected="${usuario.activo}">Activo</option>
                            <option value="false" th:selected="${!usuario.activo}">Inactivo</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   name="cambiarPassword" id="cambiarPassword">
                            <label class="form-check-label" for="cambiarPassword">
                                Cambiar contraseña
                            </label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Nueva Contraseña</label>
                        <input type="password" class="form-control" name="password">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Actualizar</button>
                        <a href="/admin/usuarios" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
