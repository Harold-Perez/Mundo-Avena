<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f5f0e8; }
        .navbar { background-color: #2d5a27; }
        .btn-primary { background-color: #2d5a27; border-color: #2d5a27; }
        .btn-primary:hover { background-color: #1e3d1a; border-color: #1e3d1a; }
        .badge-admin { background-color: #2d5a27; }
        .badge-gerencia { background-color: #d4a017; }
        .badge-empleado { background-color: #5a7a2d; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">🌾 Mundo Avena - Admin</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">👥 Gestión de Usuarios</h3>
        <a href="/admin/usuarios/nuevo" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Nuevo Usuario
        </a>
    </div>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Nombre Completo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Fecha Creación</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.nombreCompleto}"></td>
                    <td>
                                <span th:if="${u.rol.name() == 'ADMINISTRADOR'}"
                                      class="badge badge-admin bg-success">Administrador</span>
                        <span th:if="${u.rol.name() == 'GERENCIA'}"
                              class="badge bg-warning text-dark">Gerencia</span>
                        <span th:if="${u.rol.name() == 'EMPLEADO'}"
                              class="badge bg-secondary">Empleado</span>
                    </td>
                    <td>
                        <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                        <span th:unless="${u.activo}" class="badge bg-danger">Inactivo</span>
                    </td>
                    <td th:text="${#temporals.format(u.fechaCreacion, 'dd/MM/yyyy')}"></td>
                    <td>
                        <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:if="${u.activo}" th:action="@{/admin/usuarios/desactivar/{id}(id=${u.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('¿Desactivar usuario?')">
                                <i class="bi bi-person-x"></i>
                            </button>
                        </form>
                        <form th:unless="${u.activo}" th:action="@{/admin/usuarios/activar/{id}(id=${u.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                <i class="bi bi-person-check"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
