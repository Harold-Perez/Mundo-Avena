<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Mundo Avena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f0e8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: white; border-radius: 16px; padding: 50px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.1); max-width: 500px; }
        .error-code { font-size: 80px; font-weight: 700; color: #2d5a27; line-height: 1; }
        .btn-volver { background-color: #2d5a27; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: 600; text-decoration: none; }
        .btn-volver:hover { background-color: #1e3d1a; color: white; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-code" th:text="${status}">404</div>
    <h4 class="fw-bold mt-3 mb-2">¡Oops! Algo salió mal</h4>
    <p class="text-muted mb-4" th:text="${error}">Página no encontrada</p>
    <a href="/login" class="btn-volver">🌾 Volver al inicio</a>
</div>
</body>
</html>
