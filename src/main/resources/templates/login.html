<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mundo Avena — Sistema de Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background-color: #f5f0e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.10);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo-container img {
            width: 180px;
            object-fit: contain;
        }

        .sistema-titulo {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #b28c65;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .sistema-subtitulo {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 36px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #b28c65, transparent);
            margin-bottom: 32px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1.5px solid #e0d8ce;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            background-color: #faf9f7;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #2d5a27;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(45,90,39,0.1);
        }

        .btn-login {
            width: 100%;
            background-color: #2d5a27;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background-color: #1e3d1a;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(45,90,39,0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-msg {
            background-color: #fff5f5;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 16px;
            color: #dc2626;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }

        .footer-login {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #bbb;
        }

        .footer-login span {
            color: #b28c65;
            font-weight: 600;
        }

        .input-group-icon {
            position: relative;
        }

        .input-group-icon .form-control {
            padding-left: 44px;
        }

        .input-group-icon .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #b28c65;
            z-index: 1;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">

        <!-- Logo -->
        <div class="logo-container">
            <img th:src="@{/img/logo-mundoavena.png}"
                 alt="Mundo Avena"
                 loading="eager"
                 fetchpriority="high">
        </div>

        <!-- Título -->
        <div class="sistema-titulo">Sistema de Control de Insumos</div>
        <div class="sistema-subtitulo">Plataforma de gestión de producción</div>

        <!-- Divider dorado -->
        <div class="divider"></div>

        <!-- Error -->
        <div th:if="${param.error}" class="error-msg">
            Usuario o contraseña incorrectos
        </div>

        <!-- Logout -->
        <div th:if="${param.logout}" class="alert alert-success text-center" style="border-radius:10px; font-size:13px;">
            Sesión cerrada correctamente
        </div>

        <!-- Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-4">
                <label class="form-label">Usuario</label>
                <div class="input-group-icon">
                    <span class="icon">👤</span>
                    <input type="text" name="username" class="form-control"
                           placeholder="Ingresa tu usuario" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group-icon">
                    <span class="icon">🔒</span>
                    <input type="password" name="password" class="form-control"
                           placeholder="Ingresa tu contraseña" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Iniciar Sesión →
            </button>
        </form>

        <!-- Footer -->
        <div class="footer-login">
            <span>Mundo Avena</span> — Sistema interno de producción<br>
            Km. 22.7 Carretera a El Salvador, Guatemala
        </div>
    </div>
</div>
</body>
</html>
